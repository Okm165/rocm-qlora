# =============================================================================
# Qwen3-8B · QLoRA — the comfortable fallback (downloads on first use)
# =============================================================================
# Much smaller memory footprint than the 27B (≈8 GB/GPU), no checkpoint
# surgery needed (this model is fully quantized by prepare), and the whole
# pipeline is identical. Use it to iterate on data/hyperparameters quickly,
# then apply the lessons to the 27B config.
# =============================================================================

[run]
name = "qwen3-8b"
seed = 42
output_root = ".outputs"

[model]
name = "Qwen/Qwen3-8B"
prepared_dir = ".data/models/qwen3-8b-nf4"
attn = "auto"
dtype = "bfloat16"

[quantization]
quant_type = "nf4"
double_quant = true
requantize_vision = false
requantize_modules = []       # plain bf16 source: everything gets quantized
                              # (except lm_head, which stays 16-bit for chunked CE)

[data]
path = ".data/raw/dataset.json"
eval_fraction = 0.05
max_length = 1536
packing = false
assistant_only_loss = true
dataset_num_proc = 8

[lora]
r = 16
alpha = 32
dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[optim]
lr = 1.0e-4
epochs = 3
per_device_batch_size = 2
grad_accum = 2                # effective batch = 2 × 2 × GPUs
max_grad_norm = 0.3
weight_decay = 0.01
optimizer = "adamw_torch"     # plenty of VRAM — no need for 8-bit states
scheduler = "cosine"
warmup_ratio = 0.03
gradient_checkpointing = true
loss_type = "nll"

[eval]
per_epoch = true
per_device_batch_size = 2
eval_packing = false

[logging]
chart_snapshot_steps = 10
gpu_sample_seconds = 5.0

[env]
hip_alloc_conf = "garbage_collection_threshold:0.8"
aotriton = "auto"
omp_num_threads = 8

[dist]
mode = "auto"
gpus = "auto"

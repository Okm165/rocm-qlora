# =============================================================================
# Qwen3-8B · QLoRA — the comfortable fallback (downloads on first use)
# =============================================================================
# Much smaller memory footprint than the 27B (≈8 GB/GPU, derived from the
# parameter count — this config has not been run on this box; the 27B numbers
# in configs/qwen3.8-27b.toml are measured), no checkpoint surgery needed
# (this model is fully quantized by prepare), and the whole pipeline is
# identical. Use it to iterate on data/hyperparameters quickly,
# then apply the lessons to the 27B config.
# =============================================================================

[run]
name = "qwen3-8b"
seed = 42                  # seeds python/numpy/torch + the dataset split
output_root = ".outputs"   # runs land in <root>/runs/<timestamp>-<name>

[model]
name = "Qwen/Qwen3-8B"
prepared_dir = ".data/models/qwen3-8b-nf4"   # what `prepare` writes
attn = "sdpa"              # "sdpa" = torch's fused kernels; "eager" = math only (slowest, always correct)
sdpa_disable = ["mem_efficient"]   # gfx1100: the mem-efficient *backward* is the observed NaN source (docs/02)
dtype = "bfloat16"         # compute dtype for the quantized matmuls

[quantization]
quant_type = "nf4"         # 4-bit normal float (measured 0.52 B/param, docs/02)
double_quant = true        # quantize the quantization scales too
requantize_vision = false  # text-only checkpoint — no vision tower
requantize_modules = []       # plain bf16 source: everything gets quantized
                              # (except lm_head, which stays 16-bit for chunked CE)

[data]
path = ".data/raw/dataset.json"        # ShareGPT-style {messages: [...]} JSON
eval_fraction = 0.05                   # holdout for the per-epoch eval
max_length = 1536                      # measure yours: rocm-qlora data (docs/03)
packing = false                        # no document-aware masking in the attention stack (docs/01)
assistant_only_loss = true             # loss on assistant turns only
training_template = "qwen3"   # stock template matches TRL exactly; declared for clarity
dataset_num_proc = 8                   # host processes for tokenization

[lora]
r = 16                     # rank; capacity vs. overfitting lever (docs/03)
alpha = 32                 # convention alpha = 2r, so the scaling is 2
dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[optim]
lr = 1.0e-4
epochs = 3
per_device_batch_size = 2
grad_accum = 2                # effective batch = 2 × 2 × GPUs
max_grad_norm = 0.3
weight_decay = 0.01
optimizer = "adamw_torch"     # plenty of VRAM — no need for 8-bit states
scheduler = "cosine"
warmup_ratio = 0.03
gradient_checkpointing = true
loss_type = "nll"

[eval]
per_epoch = true           # holdout eval at each epoch end
per_device_batch_size = 2  # no-grad forwards are cheap
eval_packing = false

[logging]
chart_snapshot_steps = 10  # live loss.png/overview.png refresh cadence (steps)
gpu_sample_seconds = 5.0   # rocm-smi sampling period (background thread)

[env]
hip_alloc_conf = "garbage_collection_threshold:0.8"   # never expandable_segments (docs/05)
aotriton = true             # TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL for the workers (docs/02)
omp_num_threads = 8        # host threads per rank

[dist]
mode = "auto"              # DDP when more than one GPU is selected
gpus = "auto"              # every visible GPU; override with --gpus 0,1

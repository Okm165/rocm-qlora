# =============================================================================
# Qwen3.8-27B · QLoRA on gfx1100 (RDNA3, 24 GB cards)
# =============================================================================
# Knob-by-knob reasoning: docs/03-hyperparameters.md. The 24 GB memory story
# (why batch 1 × accum 4, why `prepare` matters): docs/02 + docs/05. Numbers
# marked "(measured)" come from `rocm-qlora data` / `doctor`.
# =============================================================================

[run]
name = "qwen3.8-27b"
seed = 42
output_root = ".outputs"

[model]
# Pre-quantized NF4 source (unsloth's community 4-bit conversion of Qwen3.8-27B).
name = "unsloth/Qwen3.8-27B-unsloth-bnb-4bit"
# Where `prepare` writes the slimmed, train-ready checkpoint (git-ignored).
prepared_dir = ".data/models/qwen3.8-27b-nf4"
attn = "auto"          # let `doctor`'s probe pick sdpa/eager
dtype = "bfloat16"     # compute dtype for the quantized matmuls

[quantization]
quant_type = "nf4"
double_quant = true
quant_storage = "uint8"
requantize_vision = true
# The upstream checkpoint leaves in_proj_qkv (2.5B params) in 16-bit.
# `prepare` re-quantizes it to NF4 — frees ~3.7 GB per GPU (5 GB → 1.3 GB),
# the difference between fitting and OOM on a 24 GB card.
# lm_head is never quantized (TRL's fused loss slices the raw weight).
requantize_modules = ["in_proj_qkv"]

[data]
path = ".data/raw/dataset.json"
eval_fraction = 0.05   # a small holdout; enough to see the trend
max_length = 1536      # ≈p99 of the token distribution (p99=1469, p100=1980); see `rocm-qlora data`
packing = false        # correctness first: see docs/03
assistant_only_loss = true
dataset_num_proc = 8

[lora]
r = 16
alpha = 32             # scaling = alpha/r = 2 (common modern default)
dropout = 0.05         # small dataset → mild regularization
target_modules = [
  # full attention (every 4th layer)
  "q_proj", "k_proj", "v_proj", "o_proj",
  # Gated DeltaNet linear attention (3 of 4 layers)
  "in_proj_qkv", "in_proj_z", "in_proj_a", "in_proj_b", "out_proj",
  # MLP
  "gate_proj", "up_proj", "down_proj",
]

[optim]
lr = 1.0e-4            # conservative end of the 1e-4…2e-4 QLoRA range
epochs = 3
# Micro-batch 1 × accum 4: same effective batch at ~half the activation
# memory of 2 × 2 (batch-2 OOMs: docs/05).
per_device_batch_size = 1
grad_accum = 4         # effective batch = 1 × 4 × GPU count (12 on a 3-GPU run)
max_grad_norm = 0.3    # QLoRA paper value
weight_decay = 0.01
optimizer = "adamw_8bit"   # 8-bit optimizer states (ROCm-supported)
scheduler = "cosine"
warmup_ratio = 0.03
gradient_checkpointing = true
# Activation offloading: hold checkpointed activations in pinned host RAM
# (frees device memory; costs a D2H+H2D copy per layer per step).
activation_offloading = false
# Selective checkpointing: checkpoint every Nth layer (1 = all layers). >1
# trades memory back for speed when full checkpointing frees more than needed.
checkpoint_every_n_layers = 1
loss_type = "nll"          # standard NLL; TRL's fused kernel chunks it internally

[eval]
per_epoch = true
per_device_batch_size = 2   # no-grad forwards are cheap; halves eval wall time
eval_packing = false

[logging]
chart_snapshot_steps = 10   # live overview.png/loss.png refresh cadence
gpu_sample_seconds = 5.0
keep_epoch_checkpoints = true
# Mid-epoch full checkpoint (84 steps/epoch → every ~half epoch ≈ 11 min):
# a GPU reset or crash loses at most ~11 min instead of a whole epoch.
# Resume with: rocm-qlora train --config … --resume .outputs/runs/<run>
checkpoint_every_n_steps = 42

[env]
# GC threshold only — `expandable_segments` corrupted numerics on this stack
# (docs/05); headroom is bought with batch 1 × accum 4 (see [optim]).
hip_alloc_conf = "garbage_collection_threshold:0.8"
aotriton = "auto"       # doctor's SDPA verdict decides the env flag
omp_num_threads = 8     # a handful per rank; avoids host oversubscription

[env.extra]
# Removes the documented KFD-eviction trigger of the MES/GPU-reset failure
# class (ROCm #6386; cost ~0.1%, outputs unchanged — docs/05).
HSA_USE_SVM = "0"
# Health-analysis verbosity for the package logger (INFO default). DEBUG keeps
# the same output today but future diagnostics will land at DEBUG level.
# For HF/TRL internals in the rank logs, launch with ROCM_QLORA_HF_LOG_LEVEL=info.
ROCM_QLORA_LOG_LEVEL = "DEBUG"

[dist]
mode = "auto"           # DDP across every visible GPU
gpus = "auto"
